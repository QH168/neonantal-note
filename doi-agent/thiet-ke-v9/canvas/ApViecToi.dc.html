<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Việc, giao diện tối</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0} button,input{font-family:inherit}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0E151C; color: #E8EFF5; font-family: 'Be Vietnam Pro', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="padding: 14px 16px 0; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; gap: 8px">
      <div style="flex-grow: 1; min-width: 0">
        <div style="font-size: 13px; color: #9FB1C1">Thứ Năm, 05/11/2026</div>
        <h1 style="margin: 0; font-size: 20px; font-weight: 700; white-space: nowrap">Việc hôm nay</h1>
      </div>
      <button type="button" aria-label="Thư viện viết tắt" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #3B4E60; background: #17212B; color: #5BB8EE; font-size: 15px; font-weight: 700">/a</button>
      <button type="button" aria-label="Sao lưu và cài đặt" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #3B4E60; background: #17212B; color: #E8EFF5; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15.5H5.2a3.2 3.2 0 0 1-.4-6.4A4.8 4.8 0 0 1 14.2 8a3.8 3.8 0 0 1 .8 7.5H14"></path><path d="M10 17V10.5M7.6 12.8 10 10.4l2.4 2.4"></path></svg></button>
      <button type="button" aria-label="Lịch" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #3B4E60; background: #17212B; color: #E8EFF5; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4.5" width="14" height="12.5" rx="2"></rect><path d="M3 8.5h14M7 3v3M13 3v3"></path></svg></button>
    </div>
    <div style="display: flex; align-items: center; gap: 10px">
      <div style="flex-grow: 1; height: 6px; border-radius: 3px; background: #263747"><div style="width: 33%; height: 6px; border-radius: 3px; background: #5BB8EE"></div></div>
      <span style="font-size: 13px; color: #9AD3F5; font-weight: 600">Đã xong 2/6</span>
    </div>
    <div style="display: flex; padding: 4px; border-radius: 14px; background: #263747">
      <button type="button" aria-pressed="true" style="flex-grow: 1; height: 44px; border: 0; border-radius: 11px; background: #17212B; font-size: 15px; font-weight: 600; color: #E8EFF5">Việc</button>
      <button type="button" aria-pressed="false" style="flex-grow: 1; height: 44px; border: 0; border-radius: 11px; background: transparent; font-size: 15px; font-weight: 600; color: #9FB1C1">Khám</button>
    </div>
    <nav aria-label="Khu vực làm việc" style="display: flex; gap: 8px; overflow: hidden; margin-right: -16px">
      <button type="button" aria-pressed="false" style="flex-shrink: 0; height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid #3B4E60; background: #17212B; color: #E8EFF5; font-size: 15px; font-weight: 500">Tất cả 4</button>
      <button type="button" aria-pressed="true" style="flex-shrink: 0; height: 44px; padding: 0 16px; border-radius: 22px; border: 0; background: #5BB8EE; color: #06202F; font-size: 15px; font-weight: 600">NICU 3</button>
      <button type="button" style="flex-shrink: 0; height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid #2A3948; background: #17212B; color: #7F93A5; font-size: 15px; font-weight: 500">CT</button>
      <button type="button" style="flex-shrink: 0; height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid #2A3948; background: #17212B; color: #7F93A5; font-size: 15px; font-weight: 500">KAN</button>
      <button type="button" style="flex-shrink: 0; height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid #3B4E60; background: #17212B; color: #E8EFF5; font-size: 15px; font-weight: 500">HP 1</button>
    </nav>
  </header>

  <main style="flex-grow: 1; padding: 12px 16px 0; display: flex; flex-direction: column; gap: 8px; overflow: hidden">
    <h2 style="margin: 2px 0 0; display: flex; align-items: baseline; gap: 6px; font-size: 15px; font-weight: 700">NICU <span style="font-size: 13px; font-weight: 500; color: #9FB1C1">Còn 2/4 việc</span></h2>
    <div style="display: flex; align-items: center; gap: 4px; min-height: 54px; box-sizing: border-box; padding: 4px 9px 4px 14px; background: #17212B; border: 1px solid #2A3948; border-radius: 14px">
      <div style="flex-grow: 1; min-width: 0; padding: 6px 0">
        <div style="font-size: 15px; line-height: 1.35">Xem lại khí máu giường 3</div>
        <div style="font-size: 13px; line-height: 1.4; color: #9FB1C1; margin-top: 2px">pH 7.28, pCO₂ 55, báo BS trực</div>
      </div>
      <span style="width: 26px; height: 26px; flex-shrink: 0; border-radius: 13px; background: #4C2723; color: #F5C4BD; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center">NV</span>
      <span style="width: 26px; height: 26px; flex-shrink: 0; border-radius: 13px; background: #34284A; color: #D8C7EF; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center">XN</span>
    </div>
    <div style="position: relative; height: 54px; border-radius: 14px; overflow: hidden; background: #2F5A34">
      <div style="position: absolute; inset: 0; transform: translateX(118px); box-sizing: border-box; display: flex; align-items: center; padding: 4px 9px 4px 14px; background: #17212B; border: 1px solid #2A3948; border-radius: 14px">
        <div style="flex-grow: 1; min-width: 0; font-size: 15px; white-space: nowrap; overflow: hidden">Hội chẩn ngoại</div>
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 4px; min-height: 54px; box-sizing: border-box; padding: 4px 9px 4px 14px; background: #17212B; border: 1px solid #2A3948; border-radius: 14px">
      <div style="flex-grow: 1; min-width: 0; font-size: 15px">Cập nhật cân nặng</div>
      <span style="width: 26px; height: 26px; flex-shrink: 0; border-radius: 13px; background: #173A44; color: #A9D8E5; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center">CK</span>
    </div>
    <div style="display: flex; align-items: center; gap: 4px; min-height: 54px; box-sizing: border-box; padding: 4px 9px 4px 14px; background: #17212B; border: 1px solid #2A3948; border-radius: 14px">
      <div style="flex-grow: 1; min-width: 0; font-size: 15px; color: #9FB1C1">Ký y lệnh truyền máu</div>
      <span style="width: 26px; height: 26px; flex-shrink: 0; border-radius: 13px; background: #4C2723; color: #F5C4BD; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; opacity: 0.45">NV</span>
      <span role="img" aria-label="Đã xong" style="width: 26px; height: 26px; flex-shrink: 0; margin-left: 4px; border-radius: 13px; background: #A5D6A7; color: #0B2410; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8.5l3.2 3.2L13 4.8"></path></svg></span>
    </div>
  </main>

  <form style="padding: 8px 16px 24px; background: #17212B; border-top: 1px solid #2A3948; display: flex; gap: 8px">
    <label for="avt-draft" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Nội dung công việc</label>
    <input id="avt-draft" type="text" placeholder="Ghi việc cần làm…" style="flex-grow: 1; min-width: 0; height: 44px; box-sizing: border-box; padding: 0 16px; border: 1px solid #3B4E60; border-radius: 22px; background: #1F2C38; font-size: 16px; color: #E8EFF5">
    <button type="submit" aria-label="Thêm việc" style="width: 44px; height: 44px; flex-shrink: 0; border: 0; border-radius: 22px; background: #5BB8EE; color: #06202F; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M8 3v10M3 8h10"></path></svg></button>
  </form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

  renderVals() { return {}; }
}
</script>
</body>
</html>
