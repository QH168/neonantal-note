<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Khung lịch mới</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0} button{font-family:inherit}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #8A97A3; color: #12202B; font-family: 'Be Vietnam Pro', system-ui, sans-serif; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden">
  <div style="flex-grow: 1; padding: 14px 16px; color: #F2F7FB; opacity: 0.8">
    <div style="font-size: 13px">Thứ Năm, 05/11/2026</div>
    <div style="font-size: 20px; font-weight: 700">Việc hôm nay</div>
  </div>
  <section role="dialog" aria-label="Lịch công việc" style="flex-shrink: 0; box-sizing: border-box; background: #FFFFFF; border-radius: 22px 22px 0 0; padding: 10px 12px 24px; display: flex; flex-direction: column; gap: 10px">
    <div style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #D6E2EC"></div>
    <div style="display: flex; align-items: center; gap: 4px">
      <button type="button" aria-label="Tháng trước" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: transparent; color: #12202B; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3.5L5.5 8l4.5 4.5"></path></svg></button>
      <h2 style="margin: 0; flex-grow: 1; text-align: center; font-size: 17px; font-weight: 700">Tháng 11, 2026</h2>
      <button type="button" aria-label="Tháng sau" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: transparent; color: #12202B; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.5l4.5 4.5L6 12.5"></path></svg></button>
      <button type="button" aria-label="Đóng lịch" style="width: 44px; height: 44px; border: 0; background: transparent; color: #12202B; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4.5 4.5l9 9M13.5 4.5l-9 9"></path></svg></button>
    </div>
    <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); text-align: center; font-size: 12px; font-weight: 600; color: #4A5D6E">
      <span>T2</span><span>T3</span><span>T4</span><span>T5</span><span>T6</span><span>T7</span><span style="color: #8C2A20">CN</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); row-gap: 2px">
      <sc-for list="{{cells}}" as="c" hint-placeholder-count="36">
        <button type="button" aria-label="{{c.aria}}" style="height: 58px; padding: 0; border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; gap: 2px; visibility: {{c.vis}}">
          <span style="width: 40px; height: 40px; box-sizing: border-box; border-radius: 20px; border: {{c.bd}}; background: {{c.bg}}; color: {{c.fg}}; font-size: 15px; font-weight: {{c.fw}}; display: flex; align-items: center; justify-content: center">{{c.d}}</span>
          <span style="min-width: 18px; height: 14px; padding: 0 4px; box-sizing: border-box; border-radius: 7px; background: {{c.pbg}}; color: {{c.pfg}}; font-size: 11px; font-weight: 700; line-height: 14px">{{c.n}}</span>
        </button>
      </sc-for>
    </div>
    <div style="display: flex; gap: 14px; padding: 0 6px; font-size: 12px; color: #4A5D6E">
      <span style="display: flex; align-items: center; gap: 6px"><span style="width: 18px; height: 14px; border-radius: 7px; background: #DCEFFB"></span>Việc chưa xong</span>
      <span style="display: flex; align-items: center; gap: 6px"><span style="width: 18px; height: 14px; border-radius: 7px; background: #F7E6B8"></span>Ngày đã qua, còn sót</span>
    </div>
    <button type="button" style="display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 14px; border: 0; border-radius: 12px; background: #FBF3DF; color: #6E4E00; font-size: 15px; font-weight: 600; text-align: left">
      <span style="flex-grow: 1">Còn sót 3 việc ở các ngày trước</span>
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.5l4.5 4.5L6 12.5"></path></svg>
    </button>
    <button type="button" style="height: 48px; border: 1px solid #B4C6D6; border-radius: 12px; background: #FFFFFF; color: #12202B; font-size: 15px; font-weight: 600">Về hôm nay</button>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const left = { 2: 1, 3: 2, 5: 4, 9: 1, 12: 2, 20: 1 };
    const today = 5, sel = 5;
    const cells = [];
    for (let i = 0; i < 6; i++) cells.push({ d: '', n: '', vis: 'hidden', bd: '0', bg: 'transparent', fg: '#12202B', fw: '500', pbg: 'transparent', pfg: 'transparent', aria: '' });
    for (let d = 1; d <= 30; d++) {
      const n = left[d] || 0;
      const past = d < today;
      const isSel = d === sel, isToday = d === today;
      const sunday = (6 + d - 1) % 7 === 6;
      cells.push({
        d: String(d),
        n: n ? String(n) : '',
        vis: 'visible',
        bd: isToday && !isSel ? '2px solid #0B79B8' : '0',
        bg: isSel ? '#0B79B8' : 'transparent',
        fg: isSel ? '#FFFFFF' : (sunday ? '#8C2A20' : '#12202B'),
        fw: isSel || isToday ? '700' : '500',
        pbg: n ? (past ? '#F7E6B8' : '#DCEFFB') : 'transparent',
        pfg: n ? (past ? '#6E4E00' : '#075985') : 'transparent',
        aria: 'Ngày ' + d + ' tháng 11' + (n ? ', còn ' + n + ' việc chưa xong' : '') + (isToday ? ', hôm nay' : '')
      });
    }
    return { cells };
  }
}
</script>
</body>
</html>
