<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Việc, khi chạm vào ô gõ</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0} button,input{font-family:inherit}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F2F7FB; color: #12202B; font-family: 'Be Vietnam Pro', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="flex-grow: 1; padding: 14px 16px 0; display: flex; flex-direction: column; gap: 8px; overflow: hidden">
    <div style="font-size: 13px; color: #4A5D6E">Thứ Năm, 05/11/2026</div>
    <h1 style="margin: 0 0 6px; font-size: 20px; font-weight: 700">Việc hôm nay</h1>
    <h2 style="margin: 0; display: flex; align-items: baseline; gap: 6px; font-size: 15px; font-weight: 700">NICU <span style="font-size: 13px; font-weight: 500; color: #4A5D6E">Còn 2/4 việc</span></h2>
    <div style="display: flex; align-items: center; gap: 4px; min-height: 54px; box-sizing: border-box; padding: 4px 9px 4px 14px; background: #FFFFFF; border: 1px solid #D6E2EC; border-radius: 14px">
      <div style="flex-grow: 1; min-width: 0; font-size: 15px">Xem lại khí máu giường 3</div>
      <span style="width: 26px; height: 26px; flex-shrink: 0; border-radius: 13px; background: #C62828; color: #FFFFFF; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center">NV</span>
    </div>
    <div style="display: flex; align-items: center; gap: 4px; min-height: 54px; box-sizing: border-box; padding: 4px 9px 4px 14px; background: #FFFFFF; border: 1px solid #D6E2EC; border-radius: 14px">
      <div style="flex-grow: 1; min-width: 0; font-size: 15px">Hội chẩn ngoại</div>
      <span style="width: 26px; height: 26px; flex-shrink: 0; border-radius: 13px; background: #1A3FA6; color: #FFFFFF; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center">HC</span>
    </div>
  </div>

  <form style="padding: 10px 16px 12px; background: #FFFFFF; border-top: 1px solid #D6E2EC; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; gap: 8px">
      <label for="ag-draft" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Nội dung công việc</label>
      <input id="ag-draft" type="text" value="Siêu âm tim giường 5" style="flex-grow: 1; min-width: 0; height: 44px; box-sizing: border-box; padding: 0 16px; border: 2px solid #0B79B8; border-radius: 22px; background: #FFFFFF; font-size: 16px; color: #12202B">
      <button type="submit" aria-label="Thêm việc" style="width: 44px; height: 44px; flex-shrink: 0; border: 0; border-radius: 22px; background: #0B79B8; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M8 3v10M3 8h10"></path></svg></button>
    </div>
    <div role="group" aria-label="Khu vực" style="display: flex; gap: 6px; overflow: hidden; margin-right: -16px">
      <button type="button" aria-pressed="true" style="flex-shrink: 0; height: 44px; padding: 0 14px; border: 0; border-radius: 22px; background: #0B79B8; color: #FFFFFF; font-size: 15px; font-weight: 600">NICU</button>
      <button type="button" aria-pressed="false" style="flex-shrink: 0; height: 44px; padding: 0 14px; border: 1px solid #B4C6D6; border-radius: 22px; background: #FFFFFF; font-size: 15px">CT</button>
      <button type="button" aria-pressed="false" style="flex-shrink: 0; height: 44px; padding: 0 14px; border: 1px solid #B4C6D6; border-radius: 22px; background: #FFFFFF; font-size: 15px">KAN</button>
      <button type="button" aria-pressed="false" style="flex-shrink: 0; height: 44px; padding: 0 14px; border: 1px solid #B4C6D6; border-radius: 22px; background: #FFFFFF; font-size: 15px">PS-PM</button>
      <button type="button" aria-pressed="false" style="flex-shrink: 0; height: 44px; padding: 0 14px; border: 1px solid #B4C6D6; border-radius: 22px; background: #FFFFFF; font-size: 15px">Ngoại Trú</button>
    </div>
    <div role="group" aria-label="Nhãn, chọn được nhiều" style="display: flex; gap: 8px">
      <button type="button" aria-pressed="false" aria-label="Nhãn NV" style="width: 44px; height: 44px; border-radius: 22px; border: 1.5px solid #D6E2EC; background: #FFFFFF; color: #8C2A20; font-size: 13px; font-weight: 700">NV</button>
      <button type="button" aria-pressed="false" aria-label="Nhãn BM" style="width: 44px; height: 44px; border-radius: 22px; border: 1.5px solid #D6E2EC; background: #FFFFFF; color: #6E4E00; font-size: 13px; font-weight: 700">BM</button>
      <button type="button" aria-pressed="false" aria-label="Nhãn CK" style="width: 44px; height: 44px; border-radius: 22px; border: 1.5px solid #D6E2EC; background: #FFFFFF; color: #1B5566; font-size: 13px; font-weight: 700">CK</button>
      <button type="button" aria-pressed="true" aria-label="Nhãn HC" style="width: 44px; height: 44px; border-radius: 22px; border: 2px solid #2C3F86; background: #DDE3F6; color: #2C3F86; font-size: 13px; font-weight: 700">HC</button>
      <button type="button" aria-pressed="false" aria-label="Nhãn XN" style="width: 44px; height: 44px; border-radius: 22px; border: 1.5px solid #D6E2EC; background: #FFFFFF; color: #573884; font-size: 13px; font-weight: 700">XN</button>
    </div>
    <div style="font-size: 12px; color: #4A5D6E">Khu vực lấy theo chip đang lọc. Nhãn chọn được nhiều, bỏ trống cũng được.</div>
  </form>
  <div aria-hidden="true" style="height: 291px; flex-shrink: 0; background: #CBD3DA; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #2C3E4E">Bàn phím iPhone</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
