<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Chi tiết bé</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0} button,input,textarea{font-family:inherit}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #8A97A3; color: #12202B; font-family: 'Be Vietnam Pro', system-ui, sans-serif; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden">
  <section role="dialog" aria-label="Chi tiết bé G03" style="height: 800px; box-sizing: border-box; background: #FFFFFF; border-radius: 22px 22px 0 0; padding: 10px 16px 22px; display: flex; flex-direction: column; gap: 12px">
    <div style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #D6E2EC"></div>
    <div style="display: flex; align-items: center; gap: 6px">
      <label for="cb-code" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Mã hoặc giường</label>
      <input id="cb-code" type="text" value="G03" style="flex-grow: 1; min-width: 0; height: 48px; box-sizing: border-box; padding: 0 10px; border: 0; border-bottom: 2px solid #B4C6D6; background: transparent; font-size: 17px; font-weight: 700; color: #12202B">
      <span style="flex-shrink: 0; padding: 4px 10px; border-radius: 12px; background: #EAF1F7; font-size: 13px; color: #4A5D6E">Phòng 1</span>
      <button type="button" aria-label="Đóng chi tiết" style="width: 44px; height: 44px; flex-shrink: 0; border: 0; background: transparent; color: #12202B; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4.5 4.5l9 9M13.5 4.5l-9 9"></path></svg></button>
    </div>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: #4A5D6E">Ngày sinh<input type="text" inputmode="numeric" value="2009" style="height: 44px; box-sizing: border-box; padding: 0 10px; border: 1px solid #B4C6D6; border-radius: 12px; background: #EAF1F7; font-size: 16px; color: #12202B"></label>
      <label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: #4A5D6E">Tuổi thai<input type="text" inputmode="numeric" value="320" style="height: 44px; box-sizing: border-box; padding: 0 10px; border: 1px solid #B4C6D6; border-radius: 12px; background: #EAF1F7; font-size: 16px; color: #12202B"></label>
      <label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: #4A5D6E">Cân nặng, g<input type="text" inputmode="numeric" value="2100" style="height: 44px; box-sizing: border-box; padding: 0 10px; border: 1px solid #B4C6D6; border-radius: 12px; background: #EAF1F7; font-size: 16px; color: #12202B"></label>
    </div>

    <div style="display: flex; align-items: stretch; gap: 8px">
      <button type="button" style="flex-shrink: 0; width: 112px; min-height: 56px; border: 1.5px solid #0B79B8; border-radius: 12px; background: #FFFFFF; color: #0B79B8; font-size: 15px; font-weight: 600; line-height: 1.25">Tính tuần tuổi</button>
      <div style="flex-grow: 1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 8px 12px; border-radius: 12px; background: #E6F2FB">
        <span style="display: flex; flex-direction: column; font-size: 12px; color: #4A5D6E">Ngày tuổi<b style="font-size: 17px; color: #12202B">46 ngày</b></span>
        <span style="display: flex; flex-direction: column; font-size: 12px; color: #4A5D6E">Hiệu chỉnh<b style="font-size: 17px; color: #12202B">38w4d</b></span>
      </div>
    </div>

    <h3 style="margin: 4px 0 0; display: flex; align-items: baseline; gap: 6px; font-size: 15px; font-weight: 700">Việc cần làm <span style="font-size: 13px; font-weight: 500; color: #4A5D6E">Còn 1/2</span></h3>
    <div style="display: flex; align-items: center; min-height: 50px; box-sizing: border-box; padding: 4px 9px 4px 14px; border-radius: 14px; background: #EAF1F7">
      <span style="flex-grow: 1; font-size: 15px">Tăng sữa 5 ml/cữ</span>
    </div>
    <div style="display: flex; align-items: center; min-height: 50px; box-sizing: border-box; padding: 4px 9px 4px 14px; border-radius: 14px; background: #EAF1F7">
      <span style="flex-grow: 1; font-size: 15px; color: #4A5D6E">Siêu âm não xuyên thóp</span>
      <span role="img" aria-label="Đã xong" style="width: 26px; height: 26px; flex-shrink: 0; border-radius: 13px; background: #C8E6C9; color: #2E7D32; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8.5l3.2 3.2L13 4.8"></path></svg></span>
    </div>
    <form style="display: flex; gap: 8px">
      <label for="cb-todo" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Thêm việc cần làm</label>
      <input id="cb-todo" type="text" placeholder="Thêm việc cần làm…" style="flex-grow: 1; min-width: 0; height: 44px; box-sizing: border-box; padding: 0 16px; border: 1px solid #B4C6D6; border-radius: 22px; background: #FFFFFF; font-size: 16px; color: #12202B">
      <button type="submit" aria-label="Thêm việc cần làm" style="width: 44px; height: 44px; flex-shrink: 0; border: 0; border-radius: 22px; background: #0B79B8; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M8 3v10M3 8h10"></path></svg></button>
    </form>

    <label for="cb-note" style="margin-top: 2px; font-size: 13px; color: #4A5D6E">Ghi chú</label>
    <textarea id="cb-note" placeholder="Ghi chú… (gõ / để viết tắt)" style="flex-grow: 1; min-height: 70px; box-sizing: border-box; width: 100%; margin-top: -6px; padding: 12px 14px; border: 1px solid #D6E2EC; border-radius: 14px; background: #F2F7FB; font-size: 16px; line-height: 1.5; color: #12202B; resize: none">Bú tốt, không nôn. Theo dõi cân mỗi ngày.</textarea>

    <div style="display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 4px 0 12px; border-radius: 12px; background: #F2F7FB">
      <span style="flex-grow: 1; font-size: 15px; color: #4A5D6E">Chưa khám</span>
      <button type="button" style="height: 44px; padding: 0 16px; border: 1.5px solid #2E7D32; border-radius: 22px; background: #FFFFFF; color: #1B5E20; font-size: 15px; font-weight: 600">Hoàn tất khám</button>
    </div>

    <div style="display: flex; align-items: center; gap: 8px">
      <button type="button" style="height: 48px; padding: 0 12px; border: 0; border-radius: 12px; background: transparent; color: #A8473D; display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 600"><svg width="18" height="18" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h14M9 6V4h4v2M6 6l1 12h8l1-12M9.5 9.5v5.5M12.5 9.5v5.5"></path></svg>Xoá khỏi hôm nay</button>
      <span style="flex-grow: 1"></span>
      <button type="button" style="width: 110px; height: 48px; border: 0; border-radius: 12px; background: #0B79B8; color: #FFFFFF; font-size: 15px; font-weight: 600">Xong</button>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
