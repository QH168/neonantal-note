<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Việc, giao diện sáng</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0} button,input{font-family:inherit}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F2F7FB; color: #12202B; font-family: 'Be Vietnam Pro', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="padding: 14px 16px 0; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; gap: 8px">
      <div style="flex-grow: 1; min-width: 0">
        <div style="font-size: 13px; color: #4A5D6E">Thứ Năm, 05/11/2026</div>
        <h1 style="margin: 0; font-size: 20px; font-weight: 700; white-space: nowrap">Việc hôm nay</h1>
      </div>
      <button type="button" aria-label="Thư viện viết tắt" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #B4C6D6; background: #FFFFFF; color: #0B79B8; font-size: 15px; font-weight: 700">/a</button>
      <button type="button" aria-label="Sao lưu và cài đặt, nên sao lưu hôm nay" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #B4C6D6; background: #FFFFFF; color: #12202B; display: flex; align-items: center; justify-content: center; position: relative"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15.5H5.2a3.2 3.2 0 0 1-.4-6.4A4.8 4.8 0 0 1 14.2 8a3.8 3.8 0 0 1 .8 7.5H14"></path><path d="M10 17V10.5M7.6 12.8 10 10.4l2.4 2.4"></path></svg><span style="position: absolute; top: 6px; right: 6px; width: 9px; height: 9px; border-radius: 5px; background: #C62828; border: 2px solid #FFFFFF"></span></button>
      <button type="button" aria-label="Lịch" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #B4C6D6; background: #FFFFFF; color: #12202B; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4.5" width="14" height="12.5" rx="2"></rect><path d="M3 8.5h14M7 3v3M13 3v3"></path></svg></button>
    </div>
    <div style="display: flex; align-items: center; gap: 10px">
      <div style="flex-grow: 1; height: 6px; border-radius: 3px; background: #DDE8F1"><div style="width: 33%; height: 6px; border-radius: 3px; background: #0B79B8"></div></div>
      <span style="font-size: 13px; color: #075985; font-weight: 600">Đã xong 2/6</span>
    </div>
    <div style="display: flex; padding: 4px; border-radius: 14px; background: #DDE8F1">
      <button type="button" aria-pressed="true" style="flex-grow: 1; height: 44px; border: 0; border-radius: 11px; background: #FFFFFF; font-size: 15px; font-weight: 600; color: #12202B">Việc</button>
      <button type="button" aria-pressed="false" style="flex-grow: 1; height: 44px; border: 0; border-radius: 11px; background: transparent; font-size: 15px; font-weight: 600; color: #4A5D6E">Khám</button>
    </div>
    <nav aria-label="Khu vực làm việc" style="display: flex; gap: 8px; overflow: hidden; margin-right: -16px">
      <button type="button" aria-pressed="true" style="flex-shrink: 0; height: 44px; padding: 0 16px; border-radius: 22px; border: 0; background: #0B79B8; color: #FFFFFF; font-size: 15px; font-weight: 600">Tất cả 4</button>
      <button type="button" style="flex-shrink: 0; height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid #B4C6D6; background: #FFFFFF; font-size: 15px; font-weight: 500">NICU 3</button>
      <button type="button" style="flex-shrink: 0; height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid #D6E2EC; background: #FFFFFF; color: #6B7F91; font-size: 15px; font-weight: 500">CT</button>
      <button type="button" style="flex-shrink: 0; height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid #D6E2EC; background: #FFFFFF; color: #6B7F91; font-size: 15px; font-weight: 500">KAN</button>
      <button type="button" style="flex-shrink: 0; height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid #B4C6D6; background: #FFFFFF; font-size: 15px; font-weight: 500">HP 1</button>
      <button type="button" style="flex-shrink: 0; height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid #D6E2EC; background: #FFFFFF; color: #6B7F91; font-size: 15px; font-weight: 500">PS-PM</button>
    </nav>
  </header>

  <main style="flex-grow: 1; padding: 12px 16px 0; display: flex; flex-direction: column; gap: 8px; overflow: hidden">
    <button type="button" style="align-self: flex-start; height: 44px; padding: 0 16px; border: 0; border-radius: 22px; background: #DCEFFB; color: #075985; font-size: 13px; font-weight: 600">Khám: còn 2 việc</button>

    <h2 style="margin: 2px 0 0; display: flex; align-items: baseline; gap: 6px; font-size: 15px; font-weight: 700">NICU <span style="font-size: 13px; font-weight: 500; color: #4A5D6E">Còn 2/4 việc</span></h2>

    <div style="display: flex; align-items: center; gap: 4px; min-height: 54px; box-sizing: border-box; padding: 4px 9px 4px 14px; background: #FFFFFF; border: 1px solid #D6E2EC; border-radius: 14px">
      <div style="flex-grow: 1; min-width: 0; padding: 6px 0">
        <div style="font-size: 15px; line-height: 1.35">Xem lại khí máu giường 3</div>
        <div style="font-size: 13px; line-height: 1.4; color: #4A5D6E; margin-top: 2px">pH 7.28, pCO₂ 55, báo BS trực</div>
      </div>
      <span style="width: 26px; height: 26px; flex-shrink: 0; border-radius: 13px; background: #F8D7D3; color: #8C2A20; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center">NV</span>
      <span style="width: 26px; height: 26px; flex-shrink: 0; border-radius: 13px; background: #E8DDF3; color: #573884; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center">XN</span>
    </div>

    <div style="display: flex; align-items: center; gap: 4px; min-height: 54px; box-sizing: border-box; padding: 4px 9px 4px 14px; background: #FFFFFF; border: 1px solid #D6E2EC; border-radius: 14px">
      <div style="flex-grow: 1; min-width: 0; font-size: 15px">Hội chẩn ngoại</div>
      <span style="width: 26px; height: 26px; flex-shrink: 0; border-radius: 13px; background: #F7E6B8; color: #6E4E00; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center">BM</span>
      <span style="width: 26px; height: 26px; flex-shrink: 0; border-radius: 13px; background: #DDE3F6; color: #2C3F86; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center">HC</span>
    </div>

    <div style="position: relative; height: 54px; border-radius: 14px; overflow: hidden; background: #F6D5D2">
      <div style="position: absolute; inset: 0; transform: translateX(-96px); box-sizing: border-box; display: flex; align-items: center; gap: 4px; padding: 4px 9px 4px 14px; background: #FFFFFF; border: 1px solid #D6E2EC; border-radius: 14px">
        <div style="flex-grow: 1; min-width: 0; font-size: 15px; white-space: nowrap; overflow: hidden">Cập nhật cân nặng</div>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 4px; min-height: 54px; box-sizing: border-box; padding: 4px 9px 4px 14px; background: #FFFFFF; border: 1px solid #D6E2EC; border-radius: 14px">
      <div style="flex-grow: 1; min-width: 0; font-size: 15px; color: #4A5D6E">Ký y lệnh truyền máu</div>
      <span style="width: 26px; height: 26px; flex-shrink: 0; border-radius: 13px; background: #F8D7D3; color: #8C2A20; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; opacity: 0.45">NV</span>
      <span role="img" aria-label="Đã xong" style="width: 26px; height: 26px; flex-shrink: 0; margin-left: 4px; border-radius: 13px; background: #C8E6C9; color: #2E7D32; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8.5l3.2 3.2L13 4.8"></path></svg></span>
    </div>

    <h2 style="margin: 6px 0 0; display: flex; align-items: baseline; gap: 6px; font-size: 15px; font-weight: 700">HP <span style="font-size: 13px; font-weight: 500; color: #4A5D6E">Còn 1/1 việc</span></h2>
    <div style="display: flex; align-items: center; gap: 4px; min-height: 54px; box-sizing: border-box; padding: 4px 9px 4px 14px; background: #FFFFFF; border: 1px solid #D6E2EC; border-radius: 14px">
      <div style="flex-grow: 1; min-width: 0; font-size: 15px">Gọi người nhà giường 12</div>
      <span style="width: 26px; height: 26px; flex-shrink: 0; border-radius: 13px; background: #D3EAF0; color: #1B5566; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center">CK</span>
    </div>
  </main>

  <form style="padding: 8px 16px 24px; background: #FFFFFF; border-top: 1px solid #D6E2EC; display: flex; gap: 8px">
    <label for="av-draft" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Nội dung công việc</label>
    <input id="av-draft" type="text" placeholder="Ghi việc cần làm…" style="flex-grow: 1; min-width: 0; height: 44px; box-sizing: border-box; padding: 0 16px; border: 1px solid #B4C6D6; border-radius: 22px; background: #EAF1F7; font-size: 16px; color: #12202B">
    <button type="submit" aria-label="Thêm việc" style="width: 44px; height: 44px; flex-shrink: 0; border: 0; border-radius: 22px; background: #0B79B8; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M8 3v10M3 8h10"></path></svg></button>
  </form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
