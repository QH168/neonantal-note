02/11: 37w5d - 1800 g - Đo bilirubin
03/11: 37w6d - 1820 g - Tiếp tục y lệnh cũ
04/11: 38w0d - 1850 g - Đo bilirubin (chưa xong)

PHÒNG 1 - G03
02/11: 38w1d - 2040 g - Tăng sữa 5 ml/cữ
03/11: 38w2d - 2060 g - Siêu âm não xuyên thóp
04/11: 38w3d - 2080 g - Tăng sữa 5 ml/cữ (chưa xong)

PHÒNG 2 - G12
