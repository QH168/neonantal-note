<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Thư viện viết tắt</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0} button,input{font-family:inherit}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #8A97A3; color: #12202B; font-family: 'Be Vietnam Pro', system-ui, sans-serif; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden">
  <section role="dialog" aria-label="Thư viện viết tắt" style="height: 810px; box-sizing: border-box; background: #FFFFFF; border-radius: 22px 22px 0 0; padding: 10px 16px 20px; display: flex; flex-direction: column; gap: 12px">
    <div style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #D6E2EC"></div>
    <div style="display: flex; align-items: center; justify-content: space-between">
      <h2 style="margin: 0; font-size: 17px; font-weight: 700">Thư viện viết tắt</h2>
      <button type="button" aria-label="Đóng" style="width: 44px; height: 44px; border: 0; background: transparent; color: #12202B; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4.5 4.5l9 9M13.5 4.5l-9 9"></path></svg></button>
    </div>

    <form style="display: flex; gap: 8px; align-items: flex-end">
      <label style="width: 96px; flex-shrink: 0; display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: #4A5D6E">Viết tắt<input type="text" value="/hcn" style="height: 44px; box-sizing: border-box; padding: 0 10px; border: 1px solid #B4C6D6; border-radius: 12px; background: #EAF1F7; font-size: 16px; color: #12202B"></label>
      <label style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: #4A5D6E">Đổi thành<input type="text" value="Hội chẩn ngoại khoa" style="height: 44px; box-sizing: border-box; padding: 0 10px; border: 1px solid #B4C6D6; border-radius: 12px; background: #EAF1F7; font-size: 16px; color: #12202B"></label>
      <button type="submit" aria-label="Thêm vào thư viện" style="width: 44px; height: 44px; flex-shrink: 0; border: 0; border-radius: 22px; background: #0B79B8; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M8 3v10M3 8h10"></path></svg></button>
    </form>

    <label for="tv-find" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Tìm viết tắt</label>
    <input id="tv-find" type="search" placeholder="Tìm theo chữ viết tắt hoặc nội dung" style="height: 44px; box-sizing: border-box; padding: 0 16px; border: 1px solid #B4C6D6; border-radius: 22px; background: #FFFFFF; font-size: 16px; color: #12202B">

    <div style="display: flex; align-items: baseline; justify-content: space-between; font-size: 13px; color: #4A5D6E"><span>{{count}} mục</span><span>Được sao lưu cùng dữ liệu</span></div>

    <div style="flex-grow: 1; overflow: hidden; display: flex; flex-direction: column; gap: 6px">
      <div style="position: relative; height: 50px; flex-shrink: 0; border-radius: 14px; overflow: hidden; background: #F6D5D2">
        <div style="position: absolute; inset: 0; transform: translateX(-80px); box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 4px 14px; border-radius: 14px; background: #F2F7FB">
          <span style="width: 64px; flex-shrink: 0; font-size: 15px; font-weight: 700; color: #075985">/kmdm</span>
          <span style="font-size: 15px; white-space: nowrap">Khí máu động mạch</span>
        </div>
      </div>
      <sc-for list="{{items}}" as="it" hint-placeholder-count="9">
        <div style="display: flex; align-items: center; gap: 8px; min-height: 50px; box-sizing: border-box; padding: 4px 14px; border-radius: 14px; background: #F2F7FB">
          <span style="width: 64px; flex-shrink: 0; font-size: 15px; font-weight: 700; color: #075985">{{it.k}}</span>
          <span style="flex-grow: 1; min-width: 0; font-size: 15px; line-height: 1.35">{{it.v}}</span>
        </div>
      </sc-for>
    </div>
    <p style="margin: 0; font-size: 13px; line-height: 1.45; color: #4A5D6E">Chạm 2 lần vào dòng để sửa. Vuốt trái quá 1/3 rồi thả để xoá, có hoàn tác.</p>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const items = [
      { k: '/kmtm', v: 'Khí máu tĩnh mạch' },
      { k: '/ctm', v: 'Công thức máu' },
      { k: '/crp', v: 'CRP định lượng' },
      { k: '/cay', v: 'Cấy máu' },
      { k: '/xqn', v: 'X-quang ngực thẳng' },
      { k: '/sat', v: 'Siêu âm tim' },
      { k: '/san', v: 'Siêu âm não xuyên thóp' },
      { k: '/bil', v: 'Bilirubin toàn phần, trực tiếp' },
      { k: '/dgd', v: 'Điện giải đồ' }
    ];
    return { items, count: items.length + 1 };
  }
}
</script>
</body>
</html>
